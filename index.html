
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Free Video Downloader 3.0</title>

<style>
:root {
  --bg:#f2f4ff;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e0e5f0;
}
body.dark {
  --bg:#0d1424;
  --card:#172238;
  --text:#fff;
  --muted:#b7c3d8;
  --border:#344158;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header {
  padding:25px 12px;
  text-align:center;
  color:white;
  background:linear-gradient(120deg,#292b78,#9650ef);
}
header h1 {margin:0;font-size:26px}
header p {margin-bottom:0}
main {max-width:650px;margin:25px auto;padding:15px}
.top {text-align:right;margin:15px}
.card {
  padding:24px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--card);
  box-shadow:0 10px 30px #0000000c;
  margin-bottom:20px;
}
h2 {text-align:center}
.muted {color:var(--muted);font-size:14px;line-height:1.6}
button,.button {
  border:0;
  border-radius:11px;
  padding:14px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}
.theme {
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
}
.primary {
  width:100%;
  color:white;
  background:linear-gradient(120deg,#625bff,#a044f5);
  margin-top:12px;
}
input[type=url] {
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
}
.filebox {
  display:block;
  padding:18px;
  border:2px dashed #8b82ed;
  border-radius:13px;
  text-align:center;
  background:var(--bg);
  cursor:pointer;
  line-height:1.7;
}
.filebox input {max-width:100%}
video {
  width:100%;
  max-height:360px;
  margin-top:15px;
  border-radius:12px;
  background:#000;
}
.message {
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  background:var(--bg);
  border:1px solid var(--border);
  overflow-wrap:anywhere;
  line-height:1.5;
}
.save {
  display:block;
  text-align:center;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  background:#159b65;
  color:white;
  text-decoration:none;
  font-weight:bold;
}
footer {
  text-align:center;
  color:var(--muted);
  padding:25px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>▶ Free Video Downloader</h1>
  <p>Your Free Video Tools 3.0</p>
</header>

<div class="top">
  <button class="theme" onclick="toggleTheme()">
    🌙 Dark Mode
  </button>
</div>

<main>

<!-- UPLOAD SECTION -->

<section class="card">
  <h2>📁 Upload Your Video</h2>
  <p class="muted">
    Select your own video from your Android Gallery.
  </p>

  <label class="filebox">
    📂 Choose Video From Gallery
    <br>
    <input
      type="file"
      id="videoFile"
      accept="video/mp4,video/webm,video/ogg,video/quicktime"
    >
  </label>

  <div id="uploadResult"></div>
</section>

<!-- URL SECTION -->

<section class="card">
  <h2>🔗 Direct Video URL</h2>
  <p class="muted">
    Paste a direct MP4 or WebM video-file link.
  </p>

  <input
    type="url"
    id="videoURL"
    placeholder="https://example.com/video.mp4"
  >

  <button class="primary" onclick="checkURL()">
    Check Video →
  </button>

  <div id="urlResult"></div>
</section>

</main>

<footer>
  Free Video Downloader © 2026
  <p>Only save videos you own or have permission to use.</p>
</footer>

<script>

function toggleTheme() {
  document.body.classList.toggle("dark");

  document.querySelector(".theme").textContent =
    document.body.classList.contains("dark")
    ? "☀️ Light Mode"
    : "🌙 Dark Mode";
}

// LOCAL VIDEO UPLOAD

let localURL = null;

document.getElementById("videoFile")
.addEventListener("change", function() {

  const file = this.files[0];
  const box = document.getElementById("uploadResult");

  box.replaceChildren();

  if (!file) return;

  if (!file.type.startsWith("video/")) {
    box.textContent = "Please select a video file.";
    return;
  }

  if (file.size > 200 * 1024 * 1024) {
    box.textContent =
      "File is larger than 200 MB. Please select a smaller video.";
    this.value = "";
    return;
  }

  if (localURL) URL.revokeObjectURL(localURL);

  localURL = URL.createObjectURL(file);

  const title = document.createElement("p");
  title.className = "message";
  title.textContent =
    "Selected: " + file.name +
    " (" + (file.size / 1048576).toFixed(2) + " MB)";

  const player = document.createElement("video");
  player.src = localURL;
  player.controls = true;
  player.playsInline = true;

  const save = document.createElement("a");
  save.href = localURL;
  save.download = file.name;
  save.className = "save";
  save.textContent = "⬇ Save My Video";

  box.append(title, player, save);
});

// DIRECT VIDEO URL

async function checkURL() {

  const raw = document.getElementById("videoURL").value.trim();
  const box = document.getElementById("urlResult");

  box.replaceChildren();

  let url;

  try {
    url = new URL(raw);
  } catch {
    box.textContent = "Please enter a valid video URL.";
    return;
  }

  if (!["https:", "http:"].includes(url.protocol)) {
    box.textContent = "Please use a valid HTTP or HTTPS link.";
    return;
  }

  if (!/\.(mp4|webm|ogg|mov)$/i.test(url.pathname)) {
    box.textContent =
      "This is not a direct video file. Social platform links cannot be extracted here.";
    return;
  }

  const note = document.createElement("div");
  note.className = "message";
  note.textContent = "Loading video preview...";
  box.append(note);

  const player = document.createElement("video");
  player.controls = true;
  player.playsInline = true;
  player.src = url.href;
  box.append(player);

  player.addEventListener("error", () => {
    note.textContent =
      "Preview unavailable. The video host may block browser access.";
  }, {once:true});

  const save = document.createElement("button");
  save.className = "primary";
  save.textContent = "⬇ Download Video";
  box.append(save);

  save.addEventListener("click", async () => {

    save.disabled = true;
    save.textContent = "Preparing download...";

    try {
      const response = await fetch(url.href);

      if (!response.ok) throw new Error();

      const blob = await response.blob();

      if (!blob.type.startsWith("video/") &&
          !/\.(mp4|webm|ogg|mov)$/i.test(url.pathname)) {
        throw new Error();
      }

      const blobURL = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = blobURL;
      link.download = url.pathname.split("/").pop() || "video.mp4";

      document.body.append(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(blobURL), 60000);

      save.textContent = "Download started!";

    } catch {
      save.disabled = false;
      save.textContent = "Open Video to Save";

      const link = document.createElement("a");
      link.href = url.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.className = "save";
      link.textContent = "Open Direct Video Link";
      box.append(link);

      note.textContent =
        "The host blocked direct downloading (possibly CORS). Try opening the video link. Download availability depends on the host.";
    }

  });
}

</script>

</body>
    </html>
