
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Free Video Downloader</title>

<style>
:root {
  --bg:#f3f5ff;
  --card:#ffffff;
  --text:#172033;
  --muted:#68748a;
  --primary:#635bff;
  --border:#e5e7ef;
}

body.dark {
  --bg:#0d1424;
  --card:#172238;
  --text:#ffffff;
  --muted:#b6c0d2;
  --border:#2b3850;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

header {
  padding:22px 16px;
  background:linear-gradient(120deg,#242b70,#7157e8);
  color:white;
  text-align:center;
}

header h1 {
  margin:0;
  font-size:26px;
}

header p {
  margin-bottom:0;
  opacity:.85;
}

.top {
  max-width:650px;
  margin:15px auto;
  padding:0 15px;
  text-align:right;
}

.theme {
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--card);
  color:var(--text);
}

main {
  max-width:650px;
  margin:25px auto;
  padding:15px;
}

.card {
  background:var(--card);
  border:1px solid var(--border);
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 35px #11182712;
}

h2 { text-align:center; }

.platforms {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:25px 0;
}

.platform {
  text-align:center;
  padding:15px 5px;
  border:1px solid var(--border);
  border-radius:13px;
  font-weight:bold;
  font-size:13px;
}

.platform span {
  display:block;
  font-size:24px;
  margin-bottom:8px;
}

label {
  display:block;
  margin-bottom:10px;
  font-weight:bold;
}

input {
  width:100%;
  padding:16px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
}

button {
  cursor:pointer;
  font-weight:bold;
}

.primary {
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(120deg,#635bff,#a14cff);
  color:white;
  font-size:16px;
}

#result {
  margin-top:20px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

video {
  width:100%;
  max-height:350px;
  margin-top:15px;
  border-radius:12px;
  background:#000;
}

.download {
  display:block;
  padding:14px;
  text-align:center;
  margin-top:12px;
  border-radius:12px;
  background:#16a36a;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.message {
  padding:14px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
}

footer {
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
  font-size:13px;
}

</style>
</head>

<body>

<header>
  <h1>▶ Free Video Downloader</h1>
  <p>Your Free Video Tools</p>
</header>

<div class="top">
  <button class="theme" onclick="toggleTheme()">
    🌙 Dark Mode
  </button>
</div>

<main>
  <div class="card">

    <h2>Download Your Videos</h2>

    <p style="text-align:center;color:var(--muted)">
      Simple • Free • Mobile Friendly
    </p>

    <div class="platforms">
      <div class="platform">
        <span>▶</span>YouTube
      </div>
      <div class="platform">
        <span>f</span>Facebook
      </div>
      <div class="platform">
        <span>◎</span>Instagram
      </div>
    </div>

    <label for="videoURL">Paste video URL</label>

    <input
      id="videoURL"
      type="url"
      placeholder="https://example.com/video.mp4"
    >

    <button class="primary" onclick="checkVideo()">
      Continue →
    </button>

    <div id="result"></div>

  </div>
</main>

<footer>
  <p>Free Video Downloader © 2026</p>
  <p>Only save videos you own or have permission to download.</p>
</footer>

<script>

function toggleTheme() {
  document.body.classList.toggle("dark");

  const button = document.querySelector(".theme");

  button.textContent =
    document.body.classList.contains("dark")
    ? "☀️ Light Mode"
    : "🌙 Dark Mode";
}

function checkVideo() {

  const input = document.getElementById("videoURL");
  const result = document.getElementById("result");

  result.replaceChildren();

  const raw = input.value.trim();

  if (!raw) {
    result.textContent = "Please paste a video URL.";
    return;
  }

  let url;

  try {
    url = new URL(raw);
  } catch {
    result.textContent = "Please enter a valid URL.";
    return;
  }

  if (!["https:", "http:"].includes(url.protocol)) {
    result.textContent = "Invalid video URL.";
    return;
  }

  const isDirect =
    /\.(mp4|webm|ogg|mov)$/i.test(url.pathname);

  if (!isDirect) {

    const message = document.createElement("div");
    message.className = "message";
    message.textContent =
      "This is not a direct video file. Open the original platform and use its official download option where available.";

    const link = document.createElement("a");
    link.href = url.href;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Open Original Video";
    link.style.display = "block";
    link.style.marginTop = "12px";

    result.append(message, link);
    return;
  }

  const message = document.createElement("div");
  message.className = "message";
  message.textContent = "Video link detected! Preview below:";

  const player = document.createElement("video");
  player.src = url.href;
  player.controls = true;
  player.playsInline = true;
  player.preload = "metadata";

  const download = document.createElement("a");
  download.href = url.href;
  download.download = "";
  download.className = "download";
  download.textContent = "⬇ Save / Download Video";

  result.append(message, player, download);

  player.addEventListener("error", () => {
    message.textContent =
      "This video host does not allow browser preview.";
  }, {once:true});

}

</script>

</body>
        </html>
