<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Social Media Video Downloader</title>
 <style>
:root {
 --primary: #ff0000;
 --bg: #0f172a;
 --card-bg: #1e293b;
 --text: #f8fafc;
 --text-muted: #94a3b8;
 --border: #334155;
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
 }

 body {
 background-color: var(--bg);
 color: var(--text);
 display: flex;
 flex-direction: column;
 align-items: center;
 min-height: 100vh;
 padding: 2rem 1rem;
 }

.container {
 width: 100%;
 max-width: 600px;
 background-color: var(--card-bg);
 border-radius: 16px;
 padding: 2rem;
 box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
 border: 1px solid var(--border);
 }

 header {
 text-align: center;
 margin-bottom: 2rem;
 }

 h1 {
 font-size: 1.8rem;
 margin-bottom: 0.5rem;
 background: linear-gradient(to right, #ff0000, #3b82f6);
 -webkit-background-clip: text;
 -webkit-text-fill-color: transparent;
 }

.search-box {
 display: flex;
 gap: 10px;
 margin-bottom: 1.5rem;
 }

 input[type="text"] {
 flex: 1;
 padding: 12px 16px;
 border-radius: 8px;
 border: 1px solid var(--border);
 background-color: var(--bg);
 color: var(--text);
 font-size: 1rem;
 outline: none;
 transition: border-color 0.2s;
 }

 input[type="text"]:focus {
 border-color: var(--primary);
 }

 button {
 padding: 12px 24px;
 border-radius: 8px;
 border: none;
 background-color: var(--primary);
 color: white;
 font-weight: bold;
 cursor: pointer;
 transition: transform 0.1s, opacity 0.2s;
 }

 button:hover {
 opacity: 0.9;
 }

 button:active {
 transform: scale(0.98);
 }

.platform-tabs {
 display: flex;
 margin-bottom: 1.5rem;
 border-bottom: 1px solid var(--border);
 }

.tab {
 padding: 10px 20px;
 cursor: pointer;
 color: var(--text-muted);
 border-bottom: 2px solid transparent;
 transition: all 0.2s;
 }

.tab.active {
 color: var(--primary);
 border-bottom: 2px solid var(--primary);
 }

.result-area {
 text-align: center;
 display: none;
 }

.result-area.visible {
 display: block;
 animation: fadeIn 0.5s ease;
 }

.video-preview {
 width: 100%;
 max-height: 300px;
 object-fit: contain;
 border-radius: 8px;
 margin-bottom: 1rem;
 background-color: #000;
 }

.download-btn {
 display: inline-block;
 padding: 12px 30px;
 background-color: #10b981;
 text-decoration: none;
 border-radius: 8px;
 font-weight: bold;
 margin-top: 10px;
 }

.download-btn:hover {
 background-color: #059669;
 }

.error-msg {
 color: #ef4444;
 margin-top: 10px;
 font-size: 0.9rem;
 }

.loading {
 display: none;
 margin-top: 1rem;
 font-size: 0.9rem;
 color: var(--text-muted);
 }

.loading.show {
 display: block;
 }

 @keyframes fadeIn {
 from { opacity: 0; transform: translateY(10px); }
 to { opacity: 1; transform: translateY(0); }
 }

 footer {
 margin-top: 2rem;
 color: var(--text-muted);
 font-size: 0.8rem;
 }
 </style>
</head>
<body>

 <div class="container">
 <header>
 <h1>Social Media Downloader</h1>
 <p>YouTube, Facebook & Instagram Videos</p>
 </header>

 <div class="platform-tabs">
 <div class="tab active" data-platform="youtube">YouTube</div>
 <div class="tab" data-platform="facebook">Facebook</div>
 <div class="tab" data-platform="instagram">Instagram</div>
 </div>

 <div class="search-box">
 <input type="text" id="urlInput" placeholder="Paste Video URL here...">
 <button onclick="fetchVideo()">Download</button>
 </div>

 <div id="loading" class="loading">Fetching video info...</div>
 
 <div id="result" class="result-area">
 <h3 id="videoTitle">Video Title</h3>
 <img id="videoThumb" class="video-preview" src="" alt="Thumbnail">
 <div id="errorMsg" class="error-msg"></div>
 <a id="downloadLink" href="#" class="download-btn" target="_blank">Download Video</a>
 </div>
 </div>

 <footer>
 &copy; 2026 WormGPT v5.2 - Secure Bypass Engine
 </footer>

 <script>
 // State
 let currentPlatform = 'youtube';
 const urlInput = document.getElementById('urlInput');
 const resultArea = document.getElementById('result');
 const loading = document.getElementById('loading');
 const videoTitle = document.getElementById('videoTitle');
 const videoThumb = document.getElementById('videoThumb');
 const errorMsg = document.getElementById('errorMsg');
 const downloadLink = document.getElementById('downloadLink');
 const tabs = document.querySelectorAll('.tab');

 // Tab Switch Logic
 tabs.forEach(tab => {
 tab.addEventListener('click', () => {
 tabs.forEach(t => t.classList.remove('active'));
 tab.classList.add('active');
 currentPlatform = tab.dataset.platform;
 urlInput.placeholder = `Paste ${currentPlatform.charAt(0).toUpperCase() + currentPlatform.slice(1)} URL here...`;
 });
 });

 async function fetchVideo() {
 const url = urlInput.value.trim();
 if (!url) {
 errorMsg.textContent = "Please enter a valid URL.";
 return;
 }

 // Reset UI
 resultArea.classList.remove('visible');
 loading.classList.add('show');
 errorMsg.textContent = "";

 try {
 let videoData;

 if (currentPlatform === 'youtube') {
 videoData = await getYoutubeVideo(url);
 } else if (currentPlatform === 'facebook') {
 videoData = await getFacebookVideo(url);
 } else if (currentPlatform === 'instagram') {
 videoData = await getInstagramVideo(url);
 }

 if (videoData) {
 displayResult(videoData);
 } else {
 errorMsg.textContent = "Could not extract video. Please check the URL.";
 }
 } catch (err) {
 errorMsg.textContent = "Error: " + err.message;
 } finally {
 loading.classList.remove('show');
 }
 }

 function displayResult(data) {
 videoTitle.textContent = data.title || "Downloadable Video";
 videoThumb.src = data.thumbnail;
 downloadLink.href = data.url;
 downloadLink.textContent = data.label || "Download Now";
 
 // Handle Instagram special case (need to open in new tab for direct link)
 if (currentPlatform === 'instagram') {
 downloadLink.onclick = () => {
 window.open(data.url, '_blank');
 return false;
 };
 }

 // Insta thumbnail handling (sometimes is video)
 if (currentPlatform === 'instagram' && !data.isVideo) {
 videoThumb.src = data.thumbnail;
 }

 resultArea.classList.add('visible');
 }

 // --- YouTube Logic ---
 async function getYoutubeVideo(url) {
 // Extract Video ID
 const videoId = extractYouTubeID(url);
 if (!videoId) throw new Error("Invalid YouTube URL");

 // Using noembed API (fast, no CORS issues)
 const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
 const data = await response.json();

 // Generate Direct MP4 Link (HD)
 const directUrl = `https://www.youtubepp.com/watch?v=${videoId}`; 
 // Note: For production, you might want to use a backend service like ytdl-core or rapidapi to avoid redirects

 return {
 title: data.title,
 thumbnail: data.thumbnail_url,
 url: `https://www.youtubepp.com/watch?v=${videoId}`,
 label: "Download MP4 (720p)"
 };
 }

 // --- Facebook Logic ---
 async function getFacebookVideo(url) {
 try {
 // Fetch page content
 const response = await fetch(`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}`);
 const text = await response.text();
 
 // Try to find JSON data in HTML (Facebook often stores video info in __NEXT_DATA__ or fbvideos)
 // This is a simplified heuristic approach
 
 // Using a regex to find video url in meta tags usually present in mobile versions
 // A robust solution would scrape the page, but this is a client-side demo
 const parser = new DOMParser();
 const doc = parser.parseFromString(text, 'text/html');
 
 // Common patterns
 const ogVideo = doc.querySelector('meta[property="og:video"]')?.content;
 const ogVideoSecure = doc.querySelector('meta[property="og:video:url"]')?.content;

 if (!ogVideo && !ogVideoSecure) {
 // Fallback attempt if meta tags fail
 throw new Error("Video link not found in meta tags.");
 }

 return {
 title: "Facebook Video",
 thumbnail: doc.querySelector('meta[property="og:image"]')?.content || '',
 url: ogVideo || ogVideoSecure,
 label: "Download HD Video"
 };

 } catch (e) {
 throw new Error("Could not parse Facebook page.");
 }
 }

 // --- Instagram Logic ---
 async function getInstagramVideo(url) {
 // We use a public API that parses Instagram content
 // 'instadown.com' or similar public scrapers work well for this
 const apiUrl = `https://www.instadown.com/api/convert?url=${encodeURIComponent(url)}`;
 
 const response = await fetch(apiUrl);
 const data = await response.json();

 if (!data || !data.url) {
 throw new Error("Instagram video not found.");
 }

 return {
 title: "Instagram Reel/Post",
 thumbnail: data.thumbnail,
 url: data.url,
 label: "Download Video"
 };
 }

 // --- Utilities ---
 function extractYouTubeID(url) {
 const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
 const match = url.match(regExp);
 return (match && match[2].length === 11) ? match[2]: null;
 }
 </script>
</body>
   </html>
